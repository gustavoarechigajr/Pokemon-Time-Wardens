name: Android APK

# Builds a standalone, installable APK of Time Wardens:
#   1. native  - cross-compiles the engine's native dependencies (Ruby,
#                OpenAL, OpenSSL, ...) per CPU type; cached between runs
#   2. apk     - packages the game, builds and signs the APK and publishes it
#                as the "android-latest" GitHub release (the APK is ~1.2 GB,
#                more than Actions artifact storage allows on private repos)
#   3. test    - installs that APK on an Android emulator, boots the game and
#                reports engine errors, crashes and screenshots in the log

on:
  workflow_dispatch:
  push:
    branches: [main, 'ccr-*']
    paths-ignore:
      - '**.md'
      - 'Reference Documents/**'
      - '.github/workflows/android-probe.yml'

concurrency:
  group: android-apk-${{ github.ref }}
  # Queue instead of cancelling, so a running native build still gets cached
  cancel-in-progress: false

permissions:
  contents: write

env:
  ANDROID_NDK_VERSION: 23.2.8568313
  # Outside the checkout (absolute: actions/cache rejects ".." in paths)
  PORT_DIR: /home/runner/tw-port

jobs:
  native:
    name: Native deps (${{ matrix.abi }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            host: aarch64-linux-android
            target: aarch64-linux-android
          - abi: armeabi-v7a
            host: armv7a-linux-androideabi
            target: arm-linux-androideabi
          - abi: x86_64
            host: x86_64-linux-android
            target: x86_64-linux-android
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            android
            .github

      - name: Cache native build
        id: cache
        uses: actions/cache@v4
        with:
          path: ${{ env.PORT_DIR }}/app/jni/build-${{ matrix.abi }}
          key: native-${{ matrix.abi }}-${{ hashFiles('android/port/**') }}

      - name: Install build tools
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y build-essential cmake autoconf automake libtool pkg-config gperf bison xxd

      - uses: ruby/setup-ruby@v1
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          ruby-version: '3.1'

      - name: Install Android NDK
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ANDROID_NDK_VERSION" > /dev/null
          NDK="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"
          echo "ARCH=linux-x86_64" >> "$GITHUB_ENV"
          echo "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Fetch and patch the mkxp-z Android port
        if: steps.cache.outputs.cache-hit != 'true'
        run: android/tools/fetch_port.sh "$PORT_DIR"

      - name: Build native dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: ${{ env.PORT_DIR }}/app/jni
        env:
          HOST: ${{ matrix.host }}
          TARGET: ${{ matrix.target }}
          ABI: ${{ matrix.abi }}
        run: make -j"$(nproc)"

  apk:
    name: Build APK
    needs: native
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y fluidsynth ffmpeg xxd

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ANDROID_NDK_VERSION" "platforms;android-33" "build-tools;33.0.2" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"

      - name: Fetch and patch the mkxp-z Android port
        run: android/tools/fetch_port.sh "$PORT_DIR"

      - name: Restore native build (arm64-v8a)
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.PORT_DIR }}/app/jni/build-arm64-v8a
          key: native-arm64-v8a-${{ hashFiles('android/port/**') }}
          fail-on-cache-miss: true
      - name: Restore native build (armeabi-v7a)
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.PORT_DIR }}/app/jni/build-armeabi-v7a
          key: native-armeabi-v7a-${{ hashFiles('android/port/**') }}
          fail-on-cache-miss: true
      - name: Restore native build (x86_64)
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.PORT_DIR }}/app/jni/build-x86_64
          key: native-x86_64-${{ hashFiles('android/port/**') }}
          fail-on-cache-miss: true

      - name: Cache rendered MIDI music
        uses: actions/cache@v4
        with:
          path: ~/.cache/tw-midi
          key: midi-${{ hashFiles('Audio/BGM/*.mid', 'Audio/BGM/*.MID', 'android/tools/package_game.py') }}
          restore-keys: midi-

      - name: Package game files
        run: |
          ASSETS="$PORT_DIR/app/src/main/assets"
          python3 android/tools/package_game.py . "$ASSETS" --midi-cache ~/.cache/tw-midi --build ${{ github.run_number }}
          # Identifies the app/engine code; the in-app updater offers an app
          # update only when this changes (game-only changes download files)
          ENGINE_ID=$( (git ls-files -s android/overlay android/port; cat android/port/port.env) | sha256sum | cut -c1-16)
          printf 'repo=%s\ntag=android-latest\nengine_id=%s\n' "$GITHUB_REPOSITORY" "$ENGINE_ID" > "$ASSETS/engine.properties"
          echo "ENGINE_ID=$ENGINE_ID" >> "$GITHUB_ENV"
          cat "$ASSETS/game.properties" "$ASSETS/engine.properties"
          ls -la "$ASSETS"
          df -h /

      - name: Build signed APK
        working-directory: ${{ env.PORT_DIR }}
        env:
          TW_VERSION_CODE: ${{ github.run_number }}
          TW_VERSION_NAME: 2.05-android.${{ github.run_number }}
          TW_KEYSTORE: ${{ github.workspace }}/android/keystore/release.jks
          TW_KEYSTORE_PASSWORD: ${{ secrets.TW_KEYSTORE_PASSWORD || 'timewardens' }}
          TW_KEY_ALIAS: timewardens
          TW_KEY_PASSWORD: ${{ secrets.TW_KEY_PASSWORD || 'timewardens' }}
          TW_NDK_VERSION: ${{ env.ANDROID_NDK_VERSION }}
        run: |
          if [ -n "${{ secrets.TW_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.TW_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
            export TW_KEYSTORE="$RUNNER_TEMP/release.jks"
          fi
          chmod +x gradlew
          OUT="$RUNNER_TEMP/out"
          ASSETS=app/src/main/assets
          mkdir -p "$OUT"

          # 1. Full APK: engine + bundled game (for first installs)
          ./gradlew assembleRelease --no-daemon --stacktrace -Dorg.gradle.jvmargs=-Xmx4g
          mv "$(ls app/build/outputs/apk/release/*.apk | head -1)" "$OUT/TimeWardens-${TW_VERSION_NAME}.apk"

          # 2. Update APK: same app without the bundled game (in-app updates)
          mv "$ASSETS/game.zip" "$OUT/game.zip"
          mv "$ASSETS/game-manifest.json.gz" "$OUT/game-manifest.json.gz"
          GAME_ID=$(grep '^id=' "$ASSETS/game.properties" | cut -d= -f2)
          rm -f "$ASSETS/game.properties"
          ./gradlew assembleRelease --no-daemon --stacktrace -Dorg.gradle.jvmargs=-Xmx4g
          mv "$(ls app/build/outputs/apk/release/*.apk | head -1)" "$OUT/TimeWardens-update.apk"

          # 3. What the in-app updater reads first
          cat > "$OUT/version.json" <<JSON
          {"build": ${TW_VERSION_CODE}, "game_id": "${GAME_ID}", "engine_id": "${ENGINE_ID}",
           "apk_version_code": ${TW_VERSION_CODE}, "update_apk_bytes": $(stat -c %s "$OUT/TimeWardens-update.apk")}
          JSON
          ls -la "$OUT"
          cat "$OUT/version.json"
          for apk in "$OUT"/*.apk; do
            "$ANDROID_HOME/build-tools/33.0.2/apksigner" verify --print-certs "$apk" | head -2
          done
          unzip -l "$OUT/TimeWardens-${TW_VERSION_NAME}.apk" | grep -E "lib/|assets/" | head -40

      - name: Publish release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=android-latest
          gh release delete "$TAG" --cleanup-tag -y || true
          git push origin ":refs/tags/$TAG" 2>/dev/null || true
          gh release create "$TAG" "$RUNNER_TEMP"/out/*.apk "$RUNNER_TEMP"/out/game.zip \
            "$RUNNER_TEMP"/out/game-manifest.json.gz "$RUNNER_TEMP"/out/version.json \
            --target "$GITHUB_SHA" --prerelease \
            --title "Time Wardens for Android (build ${{ github.run_number }})" \
            --notes "Android build of Time Wardens from commit ${GITHUB_SHA::8} (branch ${GITHUB_REF_NAME}). First install: download TimeWardens-2.05-android.${{ github.run_number }}.apk on your device and open it. Already installed: just open the game, it offers to download only what changed. The other files here are used by the in-app updater. See android/README.md."
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  test:
    name: Emulator test
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: android

      - name: Free disk space
        run: |
          # The emulator needs ~9 GB for its data partition on top of the APK
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/local/share/powershell /usr/local/lib/node_modules
          df -h / /home/runner

      - name: Download APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ needs.apk.outputs.tag }}" -p 'TimeWardens-2*.apk' -D "$RUNNER_TEMP/apk" -R "$GITHUB_REPOSITORY"
          ls -la "$RUNNER_TEMP/apk"
          echo "APK_PATH=$(ls $RUNNER_TEMP/apk/*.apk)" >> "$GITHUB_ENV"

      - name: Install screenshot tools
        run: sudo apt-get update -y && sudo apt-get install -y imagemagick

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run game on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          ram-size: 4096M
          disk-size: 7G
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -no-metrics
          emulator-boot-timeout: 900
          script: timeout 1800 bash android/tools/emulator_test.sh "$APK_PATH"
